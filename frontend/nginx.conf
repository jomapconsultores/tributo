server {
    # 3000: el puerto que Coolify tiene para esta app desde que la servía
    # Nixpacks; sus etiquetas de Traefik apuntan ahí.
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre (index-XXXX.js, etc.): inmutables → cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Enrutado SPA (React Router). El index.html NO se cachea: así cada deploy se
    # toma sin refrescar a mano (el navegador revalida y recibe los chunks nuevos).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
