<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Portal SRI (simulado)</title>
<style>
 body{font-family:Arial;margin:20px}
 table{border-collapse:collapse}
 td,th{border:1px solid #ccc;padding:4px;font-size:12px}
 .ui-chkbox-box{width:16px;height:16px;border:1px solid #888;display:inline-block;cursor:pointer}
 .ui-chkbox-box.ui-state-active{background:#1e6b33}
 .ui-blockui{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:9999}
</style>
</head>
<body>
<h3>Devolución de IVA - Adultos mayores</h3>
<div id="menu"><a href="#" id="lnkIngresar">Ingresar facturas electronicas</a></div>

<div id="form" style="display:none">
<table>
 <tr><td>Año solicitado</td><td><select id="cmbAnio_input"><option value="">Seleccione</option><option value="2025">2025</option><option value="2026">2026</option></select></td></tr>
 <tr><td>Periodo solicitado</td><td><select id="cmbPeriodo_input"><option value="">Seleccione un periodo</option></select></td></tr>
</table>
<button id="btnBuscar">Buscar</button>
<button id="btnVolverMenu">Volver menu principal</button>
<div id="grilla"></div>
<div id="quejas"></div>
<div id="pag" style="display:none">
  <span class="ui-paginator-current"></span>
  <span class="ui-paginator-first">«</span>
  <span class="ui-paginator-next">›</span>
</div>
<button id="btnProcesar" style="display:none">Procesar facturas seleccionadas</button>
<button id="btnGuardar" style="display:none">Guardar seleccion realizada</button>
<!-- Como en el portal real: guardar la seleccion no muestra el boton de enviar.
     El envio vive en la OTRA entrada del menu de dos pasos, y hay que entrar. -->
<a href="#" id="lnkEnvio" style="display:none">Envio de solicitud</a>
<button id="btnCargar" style="display:none">Cargar Informacion</button>
<div id="constancia"></div>
</div>

<script>
// --- Datos del "portal": julio con 12 comprobantes (3 paginas) y junio con 4.
// Dos meses hacen falta para probar el recorrido de un periodo semestral, que
// en el portal son varias solicitudes seguidas, una por mes.
const DATOS = [];
for (let i = 1; i <= 12; i++) {
  DATOS.push({
    n: i, mes: 7,
    serie: '003-301-0000891' + String(i + 10).padStart(2, '0'),
    prov: 'COMERCIAL PRUEBA ' + i + ' SA',
    fecha: '2026-07-' + String(i).padStart(2, '0'),
    iva: 1.5 + i,
  });
}
for (let i = 1; i <= 4; i++) {
  DATOS.push({
    n: i, mes: 6,
    serie: '003-301-0000892' + String(i + 10).padStart(2, '0'),
    prov: 'COMERCIAL JUNIO ' + i + ' SA',
    fecha: '2026-06-' + String(i).padStart(2, '0'),
    iva: 2 + i,
  });
}
// widget  = la caja del checkbox escucha el click (lo normal)
// nativo  = la caja no escucha; solo el checkbox interno
// muerto  = no escucha nadie (para ver cómo informa el marcador)
// quejoso = marca bien, pero al procesar el portal RECHAZA la selección, que es
//           lo que hace el SRI real cuando una fila llega sin tipo de gasto.
const MODO_URL = new URLSearchParams(location.search).get('modo') || 'widget';
let mesElegido = 7;
const delMes = () => DATOS.filter((d) => d.mes === mesElegido);
const TIPOS = [['1','VESTIMENTA'],['2','VIVIENDA'],['3','SALUD'],['4','ALIMENTACION'],['5','EDUCACION']];
let pagina = 0, porPagina = 10, marcadas = {};

const ajax = (ms, fn) => {
  const tapa = document.createElement('div');
  tapa.className = 'ui-blockui';
  document.body.appendChild(tapa);
  setTimeout(() => { tapa.remove(); fn(); }, ms);
};

function pintarGrilla() {
  const desde = pagina * porPagina;
  const delPeriodo = delMes();
  const filas = delPeriodo.slice(desde, desde + porPagina);
  let h = '<table id="tblFacturas"><tr><th>No.</th><th>RIDE</th><th>Razon social</th><th>Tipo y serie</th>' +
    '<th>Fecha</th><th>Monto IVA</th><th>IVA solicitado</th><th>Tipo de gasto</th><th>Seleccionar</th></tr>';
  filas.forEach((f) => {
    const m = marcadas[f.serie];
    h += '<tr data-serie="' + f.serie + '">' +
      '<td>' + f.n + '</td><td>RIDE</td><td>' + f.prov + '</td>' +
      '<td>FACTURA 003-301-' + f.serie.split('-')[2] + '</td>' +
      '<td>' + f.fecha + '</td><td>' + f.iva.toFixed(2) + '</td>' +
      '<td><input type="text" class="ivaSol" ' + (m ? '' : 'disabled') + ' value="' + (m ? (m.monto !== undefined ? m.monto : f.iva.toFixed(2)) : '') + '"></td>' +
      // La etiqueta refleja lo elegido, como el widget real: es lo que el
      // marcador lee para saber si el portal tomó el tipo de gasto.
      '<td><div class="ui-selectonemenu"><label class="ui-selectonemenu-label">' +
      ((m && m.tipo && (TIPOS.find((t) => t[0] === m.tipo) || [])[1]) || 'Seleccione') + '</label>' +
      '<select class="tipoGasto" ' + (m ? '' : 'disabled') + '>' +
      '<option value="">Seleccione</option>' +
      TIPOS.map((t) => '<option value="' + t[0] + '"' + (m && m.tipo === t[0] ? ' selected' : '') + '>' + t[1] + '</option>').join('') +
      '</select></div></td>' +
      '<td><div class="ui-chkbox">' +
      '<div class="ui-helper-hidden-accessible"><input type="checkbox" id="tbl:' + f.n + ':chk_input"' +
      (m ? ' checked' : '') + '></div>' +
      '<div class="ui-chkbox-box' + (m ? ' ui-state-active' : '') + '"></div></div></td>' +
      '</tr>';
  });
  h += '</table>';
  document.getElementById('grilla').innerHTML = h;
  document.getElementById('pag').style.display = '';
  document.querySelector('.ui-paginator-current').textContent =
    '(' + (pagina + 1) + ' of ' + Math.max(1, Math.ceil(delMes().length / porPagina)) + ')';
  document.getElementById('btnProcesar').style.display = '';
  const MODO = MODO_URL;
  const alternar = (serie) => {
    const dato = DATOS.find((d) => d.serie === serie);
    ajax(400, () => {
      if (marcadas[serie]) delete marcadas[serie];
      else marcadas[serie] = { monto: dato.iva.toFixed(2) };   // el portal auto-rellena
      pintarGrilla();
    });
  };
  if (MODO !== 'nativo' && MODO !== 'muerto') {
    document.querySelectorAll('.ui-chkbox-box').forEach((b) => {
      b.addEventListener('click', () => alternar(b.closest('tr').dataset.serie));
    });
  } else if (MODO === 'nativo') {
    document.querySelectorAll('.ui-chkbox input[type="checkbox"]').forEach((i) => {
      i.addEventListener('change', () => alternar(i.closest('tr').dataset.serie));
    });
  }
  document.querySelectorAll('.tipoGasto').forEach((s) => {
    s.addEventListener('change', () => {
      const serie = s.closest('tr').dataset.serie;
      ajax(300, () => { if (marcadas[serie]) marcadas[serie].tipo = s.value; pintarGrilla(); });
    });
  });
  document.querySelectorAll('.ivaSol').forEach((i) => {
    i.addEventListener('change', () => {
      const serie = i.closest('tr').dataset.serie;
      if (marcadas[serie]) marcadas[serie].monto = i.value;
    });
  });
}

document.getElementById('lnkIngresar').onclick = (e) => {
  e.preventDefault();
  ajax(500, () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('form').style.display = '';
  });
};
// Como en el portal real: se vuelve al menu de dos pasos y desde ahi se entra
// otra vez a las facturas, para el mes siguiente. La seleccion se reinicia.
document.getElementById('btnVolverMenu').onclick = () => {
  ajax(500, () => {
    marcadas = {};
    document.getElementById('grilla').innerHTML = '';
    document.getElementById('pag').style.display = 'none';
    ['btnProcesar', 'btnGuardar', 'lnkEnvio', 'btnCargar'].forEach((id) => {
      document.getElementById(id).style.display = 'none';
    });
    document.getElementById('constancia').textContent = '';
    document.getElementById('quejas').innerHTML = '';
    document.getElementById('form').style.display = 'none';
    document.getElementById('menu').style.display = '';
  });
};
document.getElementById('cmbAnio_input').onchange = function () {
  const v = this.value;
  ajax(500, () => {
    const cp = document.getElementById('cmbPeriodo_input');
    cp.innerHTML = '<option value="">Seleccione un periodo</option>' +
      ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio'].map((m, i) =>
        '<option value="' + (i + 1) + '">' + m + '</option>').join('');
  });
};
document.getElementById('btnBuscar').onclick = () => {
  const v = parseInt(document.getElementById('cmbPeriodo_input').value, 10);
  ajax(600, () => { if (v) mesElegido = v; pagina = 0; pintarGrilla(); });
};
document.querySelector('.ui-paginator-next').onclick = () => {
  if ((pagina + 1) * porPagina >= delMes().length) return;
  ajax(400, () => { pagina += 1; pintarGrilla(); });
};
document.querySelector('.ui-paginator-first').onclick = () => {
  ajax(400, () => { pagina = 0; pintarGrilla(); });
};
document.getElementById('btnProcesar').onclick = () => {
  ajax(500, () => {
    // Como el portal real: si algo no le cuadra, pinta el reclamo y NO pasa al
    // detalle. El botón de guardar nunca aparece.
    if (MODO_URL === 'quejoso') {
      document.getElementById('quejas').innerHTML =
        '<div class="ui-messages"><div class="ui-messages-error">' +
        'La factura solicitada 003-301-000089111 no detalla el tipo de gasto' +
        '</div></div>';
      return;
    }
    document.getElementById('btnGuardar').style.display = '';
  });
};
document.getElementById('btnGuardar').onclick = () => {
  ajax(500, () => { document.getElementById('lnkEnvio').style.display = ''; });
};
document.getElementById('lnkEnvio').onclick = (e) => {
  e.preventDefault();
  ajax(500, () => { document.getElementById('btnCargar').style.display = ''; });
};
document.getElementById('btnCargar').onclick = () => {
  ajax(800, () => {
    document.getElementById('constancia').textContent =
      'Carga de archivo realizada exitosamente  12-08-2026 10:15:00   Total: ' +
      Object.values(marcadas).reduce((s, m) => s + Number(m.monto || 0), 0).toFixed(2);
  });
};
</script>
</body>
</html>
